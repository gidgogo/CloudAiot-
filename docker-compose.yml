services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      # 비밀번호에 @ : / 같은 문자가 있으면 URL 인코딩해야 한다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudaiot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cloudaiot}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-1800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CONTROL_EVENT_RETENTION_DAYS: ${CONTROL_EVENT_RETENTION_DAYS:-}
      HELP_REQUEST_RETENTION_DAYS: ${HELP_REQUEST_RETENTION_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudaiot}
      POSTGRES_USER: ${POSTGRES_USER:-cloudaiot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["${MQTT_PORT:-1883}:1883"]
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  postgres-data:
  mosquitto-data:

[project]
name = "cloudaiot"
version = "0.1.0"
description = "AI 시선·손동작 비언어 의사소통 시스템"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
vision = ["opencv-python>=4.8,<5", "mediapipe>=0.10,<0.11", "numpy>=1.24,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 복사해서 config/config.yaml 로 사용하세요.
camera:
  device_index: 0
  width: 640
  height: 480
  fps: 15

gaze:
  # 같은 대상을 이 시간(초) 이상 바라봐야 '주시'로 인정
  dwell_sec: 0.8
  # 화면 좌표(0~1) 기준 기기 영역
  targets:
    light: {x1: 0.0, y1: 0.0, x2: 0.5, y2: 1.0}
    fan:   {x1: 0.5, y1: 0.0, x2: 1.0, y2: 1.0}

gesture:
  min_confidence: 0.7
  # 손동작 -> 의미
  mapping:
    open_palm: "on"
    fist: "off"
    v_sign: "call_caregiver"

intent:
  # 시선과 손동작이 이 시간(초) 안에 함께 인식돼야 실행
  fusion_window_sec: 1.5
  # 같은 명령 재실행 방지 시간(초)
  cooldown_sec: 2.0

devices:
  light:
    type: gpio_relay
    pin: 17
  fan:
    type: gpio_relay
    pin: 27

alert:
  server_url: "http://localhost:8000"
  timeout_sec: 1.0
